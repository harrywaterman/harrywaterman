<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A gallery of AI safety student group merch.">
  <title>AI safety student gallery — Harry Waterman</title>
  <link rel="icon" href="/favicons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/gallery/style.css">
</head>
<body>
  <main>
    <h1>AI safety student gallery</h1>
    <nav aria-label="Gallery categories">
      <a href="/gallery/" aria-current="page">Merch</a>
      <a href="/gallery/flyers/">Flyers</a>
      <a class="submit" href="https://forms.gle/c2aXo5JbRZ6fJLfu7">Submit yours</a>
    </nav>
    <div class="gallery">
      <!-- To add an item, copy a figure and update the image paths, alt text and caption. -->
      <figure>
        <a href="images/ucsb-navy.webp" aria-label="View AI Safety at UCSB navy shirt image">
          <img src="images/ucsb-navy.webp" srcset="images/ucsb-navy-small.webp 640w, images/ucsb-navy.webp 1600w" sizes="(max-width: 640px) calc(100vw - 40px), (max-width: 1100px) calc((100vw - 76px) / 2), 512px" width="1600" height="895" alt="Front and back of a navy UCSB T-shirt, with a white tower emblem and campus illustration above yellow AI Safety at UCSB lettering." fetchpriority="high">
        </a>
        <figcaption><a href="https://ucsbaisafety.org/">AI Safety at UCSB</a> <span>· Navy</span></figcaption>
      </figure>
      <figure>
        <a href="images/ucsb-cream.webp" aria-label="View AI Safety at UCSB cream shirt image">
          <img src="images/ucsb-cream.webp" srcset="images/ucsb-cream-small.webp 640w, images/ucsb-cream.webp 1600w" sizes="(max-width: 640px) calc(100vw - 40px), (max-width: 1100px) calc((100vw - 76px) / 2), 512px" width="1600" height="899" alt="Front and back of a cream UCSB T-shirt, with a navy tower emblem and campus illustration above AI Safety at UCSB lettering." loading="lazy" decoding="async">
        </a>
        <figcaption><a href="https://ucsbaisafety.org/">AI Safety at UCSB</a> <span>· Cream</span></figcaption>
      </figure>
      <figure>
        <a href="images/irvine.webp" aria-label="View AI Safety Irvine shirt image">
          <img src="images/irvine.webp" srcset="images/irvine-small.webp 640w, images/irvine.webp 1086w" sizes="(max-width: 640px) calc(100vw - 40px), (max-width: 1100px) calc((100vw - 76px) / 2), 512px" width="1086" height="724" alt="Mirror photo of a black AI Safety Irvine T-shirt with a white mechanical horse, star, and x-risk division lettering." loading="lazy" decoding="async">
        </a>
        <figcaption><a href="https://aisafetyuci.org/">AI Safety Irvine</a></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
